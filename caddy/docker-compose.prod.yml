name: caddy-migration

services:
  caddy:
    build:
      context: ./build
      dockerfile: Dockerfile
    image: caddy-ratelimit:local
    container_name: caddy-migration-caddy-1
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3

    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      # acme.sh's deployment path. Read-only, so Caddy cannot alter them.
      - /opt/siteledger/app/nginx/certs:/certs:ro
      # SiteLedger production SPA assets, copied out of the nginx image.
      - ./site-assets:/srv:ro
      # ACME HTTP-01 challenge webroot. acme.sh writes here; Caddy only serves
      # it, over plain HTTP, at /.well-known/acme-challenge/.
      - ./acme-webroot:/acme-webroot:ro
      - caddy-data:/data
      - caddy-config:/config
      - ./logs:/var/log/caddy

    networks:
      - app_internal
      - app_staging-internal
      # For sam-backend and sam-control-center only. This network carries no
      # database: sam-postgres and sam-redis live on
      # project-sam_project_sam_internal, which this service does NOT join.
      - monitoring

    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.75"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      # Must use the production hostname: Caddy matches exact hostnames, and
      # https://localhost/ is handled by the :443 catch-all, not this vhost.
      test: ["CMD", "wget", "--no-check-certificate", "--header=Host: siteledger.duckdns.org", "-qO-", "https://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  app_internal:
    external: true
    name: app_internal
  app_staging-internal:
    external: true
    name: app_staging-internal
  monitoring:
    external: true
    name: monitoring

volumes:
  caddy-data:
  caddy-config: