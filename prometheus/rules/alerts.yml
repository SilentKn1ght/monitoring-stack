groups:
  - name: host
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage > 85% ({{ $value }}%)"
          description: "CPU usage on {{ $labels.instance }} is at {{ $value }}%"

      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CPU usage > 95% ({{ $value }}%)"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage > 85% ({{ $value }}%)"

      - alert: CriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Memory usage > 95% ({{ $value }}%)"

      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"})) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage > 90% ({{ $value }}%)"

      - alert: CriticalDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"})) * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage > 95% ({{ $value }}%)"

      - alert: HighInodeUsage
        expr: (1 - (node_filesystem_files_free{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_files{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"})) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Inode usage > 90%"

      - alert: HostUnreachable
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter is down on {{ $labels.instance }}"

      - alert: HostHighLoadAverage
        expr: node_load15 > (count(node_cpu_seconds_total{mode="idle"}) by(instance) * 0.8)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Load average is high ({{ $value }})"

  - name: docker
    rules:
      # Per-container stop/restart rules removed 2026-08-28 (hermes setup):
      # cadvisor v0.51 with the systemd cgroup driver exports no compose labels
      # and no container_restart_count, so the old expressions never matched.
      # Container coverage is now service-level: up{} and probe_success{} rules
      # below cover every production container (incl. staging, openerp, promtail).
      - alert: CadvisorDown
        expr: up{job="cadvisor"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "cAdvisor is down - container metrics unavailable"

  - name: services
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.job }} ({{ $labels.instance }}) is down"

      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Prometheus itself is down"

      - alert: GrafanaDown
        expr: probe_success{instance="https://app-nginx-1/grafana/api/health"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Grafana is down (blackbox probe)"

      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Loki is down"

      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter is down"

      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"

      - alert: PostgreSQLExporterDown
        expr: up{job="postgres-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL Exporter is down"

      - alert: SiteLedgerUnavailable
        expr: probe_success{instance="https://app-nginx-1/api/health"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SiteLedger API is unreachable"

      - alert: SiteLedgerSlowResponse
        expr: probe_duration_seconds{instance="https://app-nginx-1/api/health"} > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SiteLedger API response time > 5s"

      - alert: SiteLedgerDown
        expr: probe_success{instance="https://app-nginx-1/"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SiteLedger Nginx is down"

  - name: internal-services
    rules:
      - alert: PrometheusInternalUnhealthy
        expr: probe_success{instance="http://prometheus:9090/-/healthy"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus internal health check failed"

      - alert: AlertmanagerInternalUnhealthy
        expr: probe_success{instance="http://alertmanager:9093/-/healthy"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager internal health check failed"

  - name: ssl
    rules:
      - alert: SSLExpiryWarning
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time() < 604800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expires in {{ $value | humanizeDuration }}"

      - alert: SSLExpiryCritical
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time() < 86400
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "SSL certificate expires in < 24h"

  - name: backups
    rules:
      - alert: BackupContainerDown
        expr: backup_health{component='container_running'} == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'DB Backup container is not running'

      - alert: BackupNotRecent
        expr: backup_health{component='recent_backup'} == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'No recent database backup (last 27h)'

      - alert: BackupFileInvalid
        expr: backup_health{component='latest_backup_valid'} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'No valid backup file found'

  - name: project-sam
    rules:
      - alert: ProjectSamBackendDown
        expr: probe_success{job="blackbox-project-sam"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Project Sam backend is unreachable"
          description: "The Project Sam backend health check failed on {{ $labels.instance }}"

      - alert: ProjectSamBackendSlow
        expr: probe_duration_seconds{job="blackbox-project-sam"} > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Project Sam backend response time > 5s"
          description: "Probe duration is {{ $value }}s"

      - alert: ProjectSamPostgresDown
        expr: up{job="postgres-exporter", instance=~".*sam-postgres.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Project Sam PostgreSQL is down"
          description: "The postgres-exporter for Project Sam is not reachable"

      - alert: ProjectSamPostgresHighConnectionCount
        expr: pg_stat_activity_count{datname="sam_companion"} > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Project Sam PostgreSQL high connection count ({{ $value }})"

  - name: hermes-additions
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Dead-man switch heartbeat - always firing; its absence means the monitoring pipeline is broken"

      - alert: PromtailDown
        expr: up{job="promtail"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Promtail is down - log shipping unavailable"

      - alert: OpenERPDown
        expr: probe_success{instance="http://openerp-app-1:8080/web/login"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "OpenERP web is unreachable"

      - alert: SiteLedgerStagingFrontendDown
        expr: probe_success{instance="http://siteledger-staging-frontend/"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SiteLedger staging frontend is unreachable"

      - alert: SiteLedgerStagingBackendDown
        expr: probe_success{instance="http://siteledger-staging-backend:3000/api/health"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SiteLedger staging backend is unhealthy"
